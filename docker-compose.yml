version: '3.8'

services:
    php:
        build:
            context: ./docker/php
        working_dir: /var/www
        volumes:
            - ./:/var/www
        entrypoint: ["sh", "./docker/php/entrypoint.sh"]
        depends_on:
            - db
        restart: unless-stopped

    nginx:
        image: nginx:1.17-alpine
        ports:
            - "80:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx:/etc/nginx/conf.d
        depends_on:
            - php
        restart: unless-stopped

    db:
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: mydatabase
            MYSQL_USER: user
            MYSQL_PASSWORD: userpassword
        ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        restart: unless-stopped

    schedule:
        build:
            context: ./docker/php-cli
        working_dir: /var/www/
        volumes:
            - ./:/var/www
        depends_on:
            - db
            - php
            - nginx
        command: sh -c '/var/www/docker/php/wait-for-it.sh php:9000 --timeout=60 --strict -- echo "PHP is up" && php artisan schedule:work'
        restart: unless-stopped

volumes:
    mysql-data:
